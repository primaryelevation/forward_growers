name: forward_growers
description: A tap-based farming game prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  path_provider: ^2.1.5
  flutter:
    sdk: flutter

dev_dependencies:
  clock: ^1.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

