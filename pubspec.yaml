name: forward_growers
description: A tap-based farming game prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  path_provider: ^2.1.5
  flutter:
    sdk: flutter

dev_dependencies:
  clock: ^1.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tools/plow.png
    - assets/tools/plant_wheat.png
    - assets/tools/plant_corn.png
    - assets/tools/plant_carrots.png
    - assets/tools/water.png
    - assets/tools/harvest.png
    - assets/tools/hammer.png
    - assets/tools/noisemaker.png
    - assets/tools/dog_whistle.png
